<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Folios QR - Mi Empresa</title>
<style>
:root{
  --bg:#eef2f7;--card:#ffffff;--tx:#1a2332;--mu:#607089;--bd:#d0d9e6;
  --ac:#0d6e6e;--act:#ffffff;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b98a8;
    --bd:#30363d;--ac:#2ea88a;--act:#0d1117
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b98a8;
  --bd:#30363d;--ac:#2ea88a;--act:#0d1117
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  line-height:1.5
}
main{max-width:880px;margin:0 auto;padding:18px}
h1{font-size:1.45rem;margin:8px 0 4px;letter-spacing:-0.3px}
p.s{color:var(--mu);margin:0 0 16px;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{
  flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);
  color:var(--tx);border-radius:10px;font-size:.95rem;cursor:pointer;
  transition:all .2s ease
}
.tabs button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.tabs button:hover:not(.on){border-color:var(--ac)}
.card{
  background:var(--card);border:1px solid var(--bd);
  border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.84rem;color:var(--mu);margin-bottom:5px;font-weight:500}
input,textarea{
  width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;
  background:var(--bg);color:var(--tx);font:inherit;transition:border-color .2s
}
input:focus,textarea:focus{outline:none;border-color:var(--ac)}
.full{grid-column:1/-1}
.btn{
  padding:11px 18px;border:0;border-radius:10px;background:var(--ac);
  color:var(--act);font-size:.95rem;cursor:pointer;margin:8px 8px 0 0;
  transition:opacity .2s
}
.btn:hover{opacity:.9}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.out{text-align:center;margin-top:18px}
canvas{max-width:100%;height:auto;border-radius:10px;background:#fff}
.hid{display:none}
video{width:100%;max-width:420px;border-radius:12px;background:#000}
.msg{color:var(--mu);font-size:.88rem;margin-top:10px}
.login{max-width:370px;margin:10vh auto 0}
.login label{margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:.87rem}
.tw{overflow-x:auto}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-weight:600;color:var(--mu);font-size:.8rem;text-transform:uppercase;letter-spacing:.3px}
.sm{padding:7px 12px;font-size:.82rem;margin:2px 4px 2px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{
  display:inline-block;background:var(--ac);color:var(--act);
  padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:600
}
</style>
</head>
<body>
<main>

<!-- LOGIN -->
<section id="login" class="card login hid">
  <h1>Acceso al sistema</h1>
  <p class="s">Ingresa tus credenciales corporativas</p>
  <label>Usuario</label>
  <input id="lu" autocomplete="username" placeholder="usuario">
  <label>Contraseña</label>
  <input id="lp" type="password" autocomplete="current-password" placeholder="••••••••">
  <button class="btn" id="blog" style="width:100%;margin-top:14px">Iniciar sesión</button>
  <div class="msg" id="lmsg"></div>
</section>

<!-- APP -->
<div id="app" class="hid">
  <div class="top">
    <h1>Generador de Folios QR</h1>
    <button class="btn sec sm" id="bout">Salir</button>
  </div>
  <p class="s">Cada código QR es único e incluye todos los datos del folio. Al escanearlo aquí, se genera una imagen descargable con la información completa.</p>

  <div class="tabs">
    <button id="t1" class="on">Crear QR</button>
    <button id="t2">Leer QR</button>
    <button id="t3">Registros</button>
  </div>

  <!-- GENERAR -->
  <section id="gen" class="card">
    <div class="grid">
      <div><label>Sucursal</label><input id="sucursal" placeholder="Ej. Centro"></div>
      <div><label>Equipos</label><input id="equipos" placeholder="Ej. Laptop-01"></div>
      <div class="full"><label>Descripción del producto</label><textarea id="descripcion" rows="2" placeholder="Detalle del equipo o producto"></textarea></div>
      <div><label>Usuario</label><input id="usuario" placeholder="Nombre de quien registra"></div>
      <div><label>Número de empleado</label><input id="empleado" placeholder="Ej. 12345"></div>
      <div><label>Empresa</label><input id="empresa" placeholder="Nombre de la empresa"></div>
      <div><label>Área</label><input id="area" placeholder="Ej. Sistemas"></div>
      <div><label>Municipio</label><input id="municipio" placeholder="Ej. Guadalajara"></div>
      <div><label>Código postal</label><input id="cp" inputmode="numeric" placeholder="Ej. 44100"></div>
      <div class="full"><label>Nota adicional</label><textarea id="nota" rows="2" placeholder="Observaciones opcionales"></textarea></div>
    </div>
    <button class="btn" id="bgen">Generar código QR</button>
    <button class="btn sec" id="bclr">Limpiar campos</button>
    <div class="msg" id="gmsg"></div>
    <div class="out hid" id="gout">
      <canvas id="qrc"></canvas>
      <div class="msg" id="gid"></div>
      <button class="btn" id="bdl">Descargar QR (JPG)</button>
    </div>
  </section>

  <!-- ESCANEAR -->
  <section id="scan" class="card hid">
    <button class="btn" id="bcam">Activar cámara</button>
    <button class="btn sec" id="bstop">Detener</button>
    <label class="btn sec" style="display:inline-block;margin:8px 0 0">
      Subir imagen QR
      <input id="file" type="file" accept="image/*" class="hid">
    </label>
    <div class="out"><video id="vid" class="hid" playsinline muted></video></div>
    <div class="msg" id="smsg"></div>
    <div class="out hid" id="sout">
      <canvas id="cardc"></canvas>
      <div><button class="btn" id="bdl2">Descargar imagen nuevamente</button></div>
    </div>
  </section>

  <!-- HISTORIAL -->
  <section id="hist" class="card hid">
    <label>Buscar por sucursal, área, empresa o folio</label>
    <input id="hq" placeholder="Escribe para filtrar...">
    <div class="msg" id="hcount"></div>
    <div class="tw">
      <table>
        <thead>
          <tr><th>Fecha</th><th>Sucursal</th><th>Área</th><th>Empresa</th><th>Acciones</th></tr>
        </thead>
        <tbody id="hb"></tbody>
      </table>
    </div>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
(function(){
"use strict";

/* ===== CONFIGURACIÓN PERSONALIZADA ===== */
var CONFIG = {
  usuario: "admin.folios",
  password: "Folio2024#QR",
  storageKey: "mis_folios_qr_v2",
  sessionKey: "mi_sesion_qr",
  prefijoFolio: "FOL",
  tituloApp: "Generador de Folios QR"
};

/* ===== UTILIDADES ===== */
var $ = function(id){ return document.getElementById(id); };
var FIELDS = [
  ["id","Folio"],
  ["sucursal","Sucursal"],
  ["equipos","Equipos"],
  ["descripcion","Descripción del producto"],
  ["usuario","Usuario"],
  ["empleado","Número de empleado"],
  ["empresa","Empresa"],
  ["area","Área"],
  ["municipio","Municipio"],
  ["cp","Código postal"],
  ["fecha","Fecha"],
  ["nota","Nota"]
];

try { qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"]; } catch(e){}

/* ===== NAVEGACIÓN POR PESTAÑAS ===== */
function tab(n){
  ["gen","scan","hist"].forEach(function(k,i){
    $(k).classList.toggle("hid", k !== n);
    $("t"+(i+1)).classList.toggle("on", k === n);
  });
  if(n !== "scan") stopCam();
  if(n === "hist") renderHist();
}
$("t1").onclick = function(){ tab("gen"); };
$("t2").onclick = function(){ tab("scan"); };
$("t3").onclick = function(){ tab("hist"); };

/* ===== SESIÓN ===== */
var sesMem = false;
function logged(){
  try { return sessionStorage.getItem(CONFIG.sessionKey) === "1"; }
  catch(e){ return sesMem; }
}
function setLogged(b){
  sesMem = b;
  try {
    if(b) sessionStorage.setItem(CONFIG.sessionKey, "1");
    else sessionStorage.removeItem(CONFIG.sessionKey);
  } catch(e){}
}
function showApp(){
  var on = logged();
  $("login").classList.toggle("hid", on);
  $("app").classList.toggle("hid", !on);
}
$("blog").onclick = function(){
  var u = $("lu").value.trim().toLowerCase();
  var p = $("lp").value;
  if(u === CONFIG.usuario.toLowerCase() && p === CONFIG.password){
    setLogged(true);
    $("lp").value = "";
    $("lmsg").textContent = "";
    showApp();
  } else {
    $("lmsg").textContent = "Credenciales incorrectas. Verifica e intenta de nuevo.";
  }
};
$("lp").onkeydown = function(e){ if(e.key === "Enter") $("blog").click(); };
$("bout").onclick = function(){ setLogged(false); stopCam(); showApp(); };

/* ===== ALMACENAMIENTO ===== */
function loadH(){
  try { return JSON.parse(localStorage.getItem(CONFIG.storageKey) || "[]"); }
  catch(e){ return []; }
}
function saveH(a){
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(a)); return true; }
  catch(e){ return false; }
}
function esc(t){
  var d = document.createElement("div");
  d.textContent = t || "";
  return d.innerHTML;
}

/* ===== HISTORIAL ===== */
function renderHist(){
  var q = $("hq").value.toLowerCase();
  var a = loadH().filter(function(v){
    return [v.id, v.sucursal, v.area, v.empresa].join(" ").toLowerCase().indexOf(q) > -1;
  });
  $("hcount").textContent = a.length + " folio(s) registrado(s)";
  $("hb").innerHTML = a.map(function(v){
    return "<tr><td>" + esc(v.fecha) + "<br><small style='color:var(--mu)'>" + esc(v.id) + "</small></td>" +
           "<td>" + esc(v.sucursal) + "</td>" +
           "<td>" + esc(v.area) + "</td>" +
           "<td>" + esc(v.empresa) + "</td>" +
           "<td>" +
           '<button class="btn sm" data-a="qr" data-i="' + esc(v.id) + '">QR</button>' +
           '<button class="btn sm sec" data-a="img" data-i="' + esc(v.id) + '">Datos</button>' +
           '<button class="btn sm sec" data-a="del" data-i="' + esc(v.id) + '">Borrar</button>' +
           "</td></tr>";
  }).join("");
}
$("hq").oninput = renderHist;

$("hb").onclick = function(e){
  var b = e.target.closest("button");
  if(!b) return;
  var id = b.getAttribute("data-i");
  var all = loadH();
  var v = all.filter(function(x){ return x.id === id; })[0];
  if(!v) return;
  var c = document.createElement("canvas");
  var accion = b.getAttribute("data-a");
  if(accion === "qr"){
    drawQR(buildText(v), c, false);
    dl(c, "QR-" + id + ".jpg");
  } else if(accion === "img"){
    drawCard(v, c);
    dl(c, "Folio-" + id + ".jpg");
  } else if(accion === "del"){
    if(confirm("¿Eliminar este folio del historial?")){
      saveH(all.filter(function(x){ return x.id !== id; }));
      renderHist();
    }
  }
};

/* ===== GENERACIÓN DE FOLIO ===== */
function newId(){
  var d = new Date();
  var p = function(n, l){ return String(n).padStart(l || 2, "0"); };
  var r = Math.random().toString(36).slice(2, 6).toUpperCase();
  return CONFIG.prefijoFolio + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) +
         "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + "-" + r;
}
function nowStr(){
  return new Date().toLocaleString("es-MX", { dateStyle:"long", timeStyle:"medium" });
}
function clean(s){
  return String(s || "").replace(/\s*[\r\n]+\s*/g, " ").trim();
}
function buildText(v){
  return FIELDS.map(function(f){ return f[1] + ": " + v[f[0]]; }).join("\n");
}
function parseText(t){
  var v = {};
  t.split("\n").forEach(function(line){
    var i = line.indexOf(": ");
    if(i < 0) return;
    var k = line.slice(0, i);
    FIELDS.forEach(function(f){
      if(f[1] === k) v[f[0]] = line.slice(i + 2);
    });
  });
  return v.id ? v : null;
}

/* ===== DIBUJO DE QR ===== */
var lastQR = null;
function drawQR(text, c, show){
  var qr = qrcode(0, "M");
  qr.addData(text, "Byte");
  qr.make();
  var n = qr.getModuleCount();
  var cell = Math.max(4, Math.floor(560 / (n + 8)));
  var m = cell * 4;
  var size = n * cell + m * 2;
  c.width = size;
  c.height = size;
  var x = c.getContext("2d");
  x.fillStyle = "#fff";
  x.fillRect(0, 0, size, size);
  x.fillStyle = "#000";
  for(var r = 0; r < n; r++){
    for(var q = 0; q < n; q++){
      if(qr.isDark(r, q)) x.fillRect(m + q * cell, m + r * cell, cell, cell);
    }
  }
  if(show) c.style.width = Math.min(size, 360) + "px";
}

$("bgen").onclick = function(){
  var v = {};
  FIELDS.forEach(function(f){
    var e = $(f[0]);
    if(e) v[f[0]] = clean(e.value);
  });
  if(!v.sucursal || !v.equipos || !v.usuario){
    $("gmsg").textContent = "Completa al menos Sucursal, Equipos y Usuario.";
    return;
  }
  v.id = newId();
  v.fecha = nowStr();
  var t = buildText(v);
  try {
    drawQR(t, $("qrc"), true);
  } catch(e){
    $("gmsg").textContent = "El texto es demasiado largo para un QR. Reduce la descripción o la nota.";
    return;
  }
  lastQR = v.id;
  var h = loadH();
  h.unshift(v);
  var saved = saveH(h);
  $("gmsg").textContent = "";
  $("gout").classList.remove("hid");
  $("gid").textContent = "Folio " + v.id + " · " + v.fecha +
    (saved ? " · guardado en registros" : " · no se pudo guardar");
};

$("bclr").onclick = function(){
  FIELDS.forEach(function(f){
    var e = $(f[0]);
    if(e) e.value = "";
  });
  $("gout").classList.add("hid");
  $("gmsg").textContent = "";
};

/* ===== DESCARGA ===== */
function dl(canvas, name){
  canvas.toBlob(function(b){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  }, "image/jpeg", 0.95);
}
$("bdl").onclick = function(){ dl($("qrc"), "QR-" + lastQR + ".jpg"); };

/* ===== IMAGEN DE DATOS ===== */
function wrap(x, text, maxW){
  var words = text.split(" ");
  var lines = [];
  var cur = "";
  words.forEach(function(w){
    var t = cur ? cur + " " + w : w;
    if(x.measureText(t).width > maxW && cur){
      lines.push(cur);
      cur = w;
    } else cur = t;
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [""];
}

function drawCard(v, c){
  var W = 900;
  var pad = 40;
  var lw = 260;
  var vw = W - pad * 2 - lw - 10;
  var x = c.getContext("2d");
  c.width = W;
  c.height = 2000;
  x.font = "26px Arial";
  var rows = FIELDS.map(function(f){
    x.font = "26px Arial";
    return { k: f[1], l: wrap(x, v[f[0]] || "-", vw) };
  });
  var H = pad + 90;
  var lh = 34;
  rows.forEach(function(r){ H += r.l.length * lh + 18; });
  H += pad;
  c.height = H;
  x = c.getContext("2d");
  x.fillStyle = "#fff";
  x.fillRect(0, 0, W, H);
  x.fillStyle = "#0d6e6e";
  x.fillRect(0, 0, W, 80);
  x.fillStyle = "#fff";
  x.font = "bold 32px Arial";
  x.textBaseline = "middle";
  x.fillText("Datos del folio", pad, 40);
  var y = pad + 90;
  x.textBaseline = "top";
  rows.forEach(function(r, i){
    var h = r.l.length * lh + 18;
    if(i % 2 === 0){
      x.fillStyle = "#f0f6f6";
      x.fillRect(pad - 10, y - 8, W - pad * 2 + 20, h);
    }
    x.fillStyle = "#607089";
    x.font = "bold 24px Arial";
    x.fillText(r.k, pad, y);
    x.fillStyle = "#1a2332";
    x.font = "26px Arial";
    r.l.forEach(function(t, j){ x.fillText(t, pad + lw + 10, y + j * lh); });
    y += h;
  });
  c.style.width = "100%";
  c.style.maxWidth = "520px";
}

/* ===== ESCANEO ===== */
var stream = null;
var raf = 0;
function stopCam(){
  cancelAnimationFrame(raf);
  if(stream){
    stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null;
  }
  $("vid").classList.add("hid");
}
function handle(text){
  var v = parseText(text);
  if(!v){
    $("smsg").textContent = "Este código QR no corresponde a un folio generado por este sistema.";
    return false;
  }
  drawCard(v, $("cardc"));
  $("sout").classList.remove("hid");
  $("smsg").textContent = "QR leído correctamente. Folio " + v.id + " descargado.";
  dl($("cardc"), "Folio-" + v.id + ".jpg");
  return true;
}
function tick(){
  var vid = $("vid");
  if(vid.readyState === vid.HAVE_ENOUGH_DATA){
    var cv = document.createElement("canvas");
    cv.width = vid.videoWidth;
    cv.height = vid.videoHeight;
    var cx = cv.getContext("2d");
    cx.drawImage(vid, 0, 0);
    var im = cx.getImageData(0, 0, cv.width, cv.height);
    var r = jsQR(im.data, im.width, im.height);
    if(r && r.data && handle(r.data)){
      stopCam();
      return;
    }
  }
  raf = requestAnimationFrame(tick);
}
$("bcam").onclick = function(){
  $("smsg").textContent = "Solicitando acceso a la cámara…";
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(function(s){
      stream = s;
      var v = $("vid");
      v.srcObject = s;
      v.classList.remove("hid");
      v.play();
      $("smsg").textContent = "Apunta la cámara al código QR.";
      tick();
    })
    .catch(function(){
      $("smsg").textContent = "No se pudo acceder a la cámara. Verifica permisos o sube una imagen.";
    });
};
$("bstop").onclick = function(){ stopCam(); $("smsg").textContent = ""; };
$("bdl2").onclick = function(){ dl($("cardc"), "Folio-" + Date.now() + ".jpg"); };
$("file").onchange = function(e){
  var f = e.target.files[0];
  if(!f) return;
  var img = new Image();
  img.onload = function(){
    var cv = document.createElement("canvas");
    cv.width = img.width;
    cv.height = img.height;
    var cx = cv.getContext("2d");
    cx.drawImage(img, 0, 0);
    var im = cx.getImageData(0, 0, cv.width, cv.height);
    var r = jsQR(im.data, im.width, im.height);
    if(r && r.data) handle(r.data);
    else $("smsg").textContent = "No se detectó ningún código QR en la imagen.";
  };
  img.src = URL.createObjectURL(f);
  e.target.value = "";
};

showApp();
})();
</script>
</body>
</html>
